# LOAF BREAKER VST, as the firmware's own: a push to main is a TEST (one pre-release, "LOAF BREAKER VST TEST",
# replaced at each push); a push to release (git push origin main:release, only when FLEXOR asks) is a release named
# after the firmware it carries (vst-vA.B.C: the loaf-vA.B.C tag of the firmware submodule's commit). Each builds the
# Windows plugin (VST3 and Standalone) and checks it as a DAW would (lbtest, pluginval); the repository is private:
# only its collaborators see them. The firmware's core (lbcore.dll) is built on Linux (MinGW-w64), the plugin on
# Windows (MSVC, JUCE). The Mac version (27 Nov 2026, FLEXOR: "fais une version mac de la VST"; VST3, AU and
# Standalone, Apple Silicon and Intel in one) is built on a Mac at each release and when run by hand (Run workflow):
# a private repository's Mac minutes count ten times, so not at every TEST.
name: Build
on:
  push:
    branches: [main, release]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The firmware (loaf-breaker) and fm1-base
        run: |
          git submodule update --init --depth 50 firmware
          git -C firmware submodule update --init --depth 1 base
      - name: The firmware's generated headers (its host build)
        run: |
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install -q --user --break-system-packages Pillow
          cd firmware && ./build.sh --host
      - name: The core, for Linux (tests) and Windows (MinGW-w64)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          mkdir -p build
          core/build_core.sh build/liblbcore.so
          core/build_core.sh build/lbcore.dll x86_64-w64-mingw32-gcc
          gcc -O1 -Icore -o build/coretest core/coretest.c build/liblbcore.so -Wl,-rpath,"$PWD/build"
          build/coretest   # (the menus' look-ahead and the sequencer, the state put back: Linux)
          x86_64-w64-mingw32-gcc -O1 -Icore -o build/coretest.exe core/coretest.c build/lbcore.dll
      - name: The break bank (every break, 44.1 kHz 16-bit)
        run: core/build_bank.sh build/breaks.bank
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: |
            build/lbcore.dll
            build/breaks.bank
            build/breaks.index
            build/coretest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gen
          path: |
            firmware/app/bank_data.h
            firmware/app/build/gen/
      - name: The plugin on Linux, and its checks (as a DAW loads it; pluginval)
        run: |
          sudo apt-get install -y -qq libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxi-dev libxcomposite-dev libxrender-dev libgl1-mesa-dev \
            libglu1-mesa-dev xvfb ninja-build
          cmake -S plugin -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --target LoafBreaker_VST3 lbtest -j4
          A=build/cmake/LoafBreaker_artefacts/Release
          cp build/liblbcore.so "$A/VST3/LOAF BREAKER.vst3/Contents/x86_64-linux/"
          mkdir -p "$A/VST3/LOAF BREAKER.vst3/Contents/Resources"
          cp build/breaks.bank build/breaks.index "$A/VST3/LOAF BREAKER.vst3/Contents/Resources/"
          xvfb-run -a build/cmake/lbtest_artefacts/Release/lbtest "$PWD/$A/VST3/LOAF BREAKER.vst3" linux.wav
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pv.zip && chmod +x pluginval
          xvfb-run -a ./pluginval --strictness-level 5 --skip-gui-tests --validate "$A/VST3/LOAF BREAKER.vst3"

  windows:
    needs: core
    if: github.ref_name == 'main' || github.ref_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: build
      - name: The plugin (JUCE, MSVC)
        run: |
          cmake -S plugin -B build/cmake -A x64   # (the Visual Studio the runner has: 2026 on windows-latest)
          cmake --build build/cmake --config Release --target LoafBreaker_VST3 LoafBreaker_Standalone lbtest -- /m
      - name: The core beside the plugin; the checks
        shell: bash
        run: |
          A="build/cmake/LoafBreaker_artefacts/Release"
          cp build/lbcore.dll "$A/VST3/LOAF BREAKER.vst3/Contents/x86_64-win/"
          mkdir -p "$A/VST3/LOAF BREAKER.vst3/Contents/Resources"
          cp build/breaks.bank build/breaks.index "$A/VST3/LOAF BREAKER.vst3/Contents/Resources/"
          cp build/lbcore.dll build/breaks.bank build/breaks.index "$A/Standalone/"
          (cd build && ./coretest.exe)   # (the same on Windows: its own way of keeping the state)
          "build/cmake/lbtest_artefacts/Release/lbtest.exe" "$PWD/$A/VST3/LOAF BREAKER.vst3" windows.wav
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pv.zip
          ./pluginval.exe --strictness-level 5 --skip-gui-tests --validate "$A/VST3/LOAF BREAKER.vst3"
      - name: The version (the firmware's)
        shell: bash
        run: |
          FW="$(git ls-tree HEAD firmware | awk '{print $3}')"
          V="$(git ls-remote --tags https://github.com/FLEXOR-R/loaf-breaker.git 'refs/tags/loaf-v*' | grep "^$FW" \
               | sed 's|.*refs/tags/loaf-v||; s|\^{}$||' | head -1 || true)"
          [ -n "$V" ] || V="dev-${FW:0:7}"
          [ "$GITHUB_REF_NAME" = release ] || V="$V-test${{ github.run_number }}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "LOAF BREAKER VST $V (firmware ${FW:0:7})" >> "$GITHUB_STEP_SUMMARY"
      - name: The package
        shell: bash
        run: |
          A="build/cmake/LoafBreaker_artefacts/Release"
          P="LOAF-BREAKER-VST-$VERSION-Windows"
          mkdir -p "pkg/$P/VST3" "pkg/$P/Standalone"
          cp -r "$A/VST3/LOAF BREAKER.vst3" "pkg/$P/VST3/"
          cp "$A/Standalone/LOAF BREAKER.exe" "$A/Standalone/lbcore.dll" "$A/Standalone/breaks.bank" "$A/Standalone/breaks.index" "pkg/$P/Standalone/"
          cp INSTALL.txt "pkg/$P/LISEZ-MOI.txt"
          cd pkg && 7z a -bd "../$P.zip" "$P" > /dev/null
          echo "PKG=$P" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
      - name: TEST pre-release (main; the one before it replaced)
        if: github.ref_name == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vst-test --cleanup-tag -y || true
          gh release create vst-test "$PKG.zip" --prerelease --target "$GITHUB_SHA" \
            --title "LOAF BREAKER VST TEST ($VERSION)" \
            --notes "A test build (Windows: VST3 for Ableton, and Standalone), replaced at the next push. $(git log -1 --format=%s)"
      - name: Release (release branch, FLEXOR's go)
        if: github.ref_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "vst-v$VERSION" > /dev/null 2>&1; then
            gh release upload "vst-v$VERSION" "$PKG.zip" --clobber
          else
            gh release create "vst-v$VERSION" "$PKG.zip" --latest --target "$GITHUB_SHA" \
              --title "LOAF BREAKER VST $VERSION" \
              --notes "LOAF BREAKER $VERSION as a plugin (Windows: VST3 for Ableton, and Standalone; Mac: VST3, AU and Standalone): the firmware loaf-v$VERSION."
          fi

  mac:
    needs: [core, windows]
    if: ${{ !cancelled() && needs.core.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (github.ref_name == 'release' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: The firmware (loaf-breaker) and fm1-base
        run: |
          git submodule update --init --depth 50 firmware
          git -C firmware submodule update --init --depth 1 base
      - uses: actions/download-artifact@v4
        with:
          name: gen
          path: firmware/app
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: build
      - name: The core, for Mac (arm64 + x86_64), and its check
        run: |
          core/build_core.sh build/liblbcore.dylib clang
          lipo -info build/liblbcore.dylib
          clang -O1 -Icore -arch arm64 -mmacosx-version-min=11.0 -o build/coretest core/coretest.c build/liblbcore.dylib -Wl,-rpath,"$PWD/build"
          build/coretest   # (the menus' look-ahead and the sequencer, the state put back: Mach-O)
      - name: The plugin (JUCE, VST3 AU Standalone, universal)
        run: |
          command -v ninja > /dev/null || brew install ninja
          cmake -S plugin -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/cmake --target LoafBreaker_VST3 LoafBreaker_AU LoafBreaker_Standalone lbtest -j4
      - name: The core and the breaks inside each bundle, signed (ad hoc); the checks
        run: |
          A="build/cmake/LoafBreaker_artefacts/Release"
          for B in "$A/VST3/LOAF BREAKER.vst3" "$A/AU/LOAF BREAKER.component" "$A/Standalone/LOAF BREAKER.app"; do
            cp build/liblbcore.dylib "$B/Contents/MacOS/"
            mkdir -p "$B/Contents/Resources"
            cp build/breaks.bank build/breaks.index "$B/Contents/Resources/"
            codesign --force -s - "$B/Contents/MacOS/liblbcore.dylib"
            codesign --force --deep -s - "$B"
            codesign --verify --deep "$B"
          done
          "build/cmake/lbtest_artefacts/Release/lbtest" "$PWD/$A/VST3/LOAF BREAKER.vst3" mac.wav
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/LOAF BREAKER.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2> /dev/null || true
          sleep 3
          auval -v aumu Lbrk Flxr
      - name: The version (the firmware's)
        run: |
          FW="$(git ls-tree HEAD firmware | awk '{print $3}')"
          V="$(git ls-remote --tags https://github.com/FLEXOR-R/loaf-breaker.git 'refs/tags/loaf-v*' | grep "^$FW" \
               | sed 's|.*refs/tags/loaf-v||; s|\^{}$||' | head -1 || true)"
          [ -n "$V" ] || V="dev-${FW:0:7}"
          [ "$GITHUB_REF_NAME" = release ] || V="$V-test${{ github.run_number }}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: The package
        run: |
          A="build/cmake/LoafBreaker_artefacts/Release"
          P="LOAF-BREAKER-VST-$VERSION-Mac"
          mkdir -p "pkg/$P"
          cp -R "$A/VST3/LOAF BREAKER.vst3" "$A/AU/LOAF BREAKER.component" "$A/Standalone/LOAF BREAKER.app" "pkg/$P/"
          cp INSTALL_MAC.txt "pkg/$P/LISEZ-MOI.txt"
          (cd pkg && ditto -c -k --keepParent "$P" "../$P.zip")
          echo "PKG=$P" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.zip
      - name: Into the release (or the TEST), beside the Windows one
        if: github.ref_name == 'main' || github.ref_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=vst-test; [ "$GITHUB_REF_NAME" = release ] && T="vst-v$VERSION"
          gh release upload "$T" "$PKG.zip" --clobber
